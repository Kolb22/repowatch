name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build Linux binaries
        run: |
          mkdir -p dist

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath \
            -o dist/repowatch-linux-amd64 \
            ./cmd/repowatch

          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -trimpath \
            -o dist/repowatch-linux-arm64 \
            ./cmd/repowatch

          cd dist
          sha256sum \
            repowatch-linux-amd64 \
            repowatch-linux-arm64 \
            > SHA256SUMS

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              dist/repowatch-linux-amd64 \
              dist/repowatch-linux-arm64 \
              dist/SHA256SUMS \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/repowatch-linux-amd64 \
              dist/repowatch-linux-arm64 \
              dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}"
          fi
